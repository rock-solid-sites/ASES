[package]
name = "ases-resource-control"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ASES resource registry, admission, lifecycle and reconciliation reference runtime"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
