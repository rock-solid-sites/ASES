name: ASES Rust-Haskell admission experiment
on:
  push:
    branches:
      - research/rust-haskell-admission-2026-11-01
    paths:
      - "research/language-eval/**"
      - ".github/workflows/ases-language-eval.yml"
  pull_request:
    paths:
      - "research/language-eval/**"
      - ".github/workflows/ases-language-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Haskell compiler and JSON library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghc libghc-aeson-dev
      - name: Record environment
        shell: bash
        run: |
          mkdir -p results
          {
            printf "utc: "; date -u --iso-8601=seconds
            printf "sha: %s\n" "$GITHUB_SHA"
            printf "runner: %s\n" "$RUNNER_OS $RUNNER_ARCH"
            uname -a
            rustc --version
            cargo --version
            ghc --version
            python3 --version
            nproc
            free -m
          } | tee results/environment.txt
      - name: Measure Rust compilation
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/rust-debug.time cargo build --manifest-path research/language-eval/rust/Cargo.toml
          /usr/bin/time -v -o results/rust-release.time cargo build --release --manifest-path research/language-eval/rust/Cargo.toml
          cargo test --manifest-path research/language-eval/rust/Cargo.toml | tee results/rust-unit-tests.txt
          cp research/language-eval/rust/Cargo.lock results/Cargo.lock
      - name: Measure Haskell compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ases-ghc-o0" "$RUNNER_TEMP/ases-ghc-o2"
          /usr/bin/time -v -o results/haskell-o0.time ghc -O0 -package aeson -outputdir "$RUNNER_TEMP/ases-ghc-o0" -o "$RUNNER_TEMP/ases-admit-hs" research/language-eval/haskell/Main.hs
          /usr/bin/time -v -o results/haskell-o2.time ghc -O2 -fforce-recomp -package aeson -outputdir "$RUNNER_TEMP/ases-ghc-o2" -o "$RUNNER_TEMP/ases-admit-hs-opt" research/language-eval/haskell/Main.hs
      - name: Run oracle and differential corpus in development and optimized modes
        shell: bash
        run: |
          set -euo pipefail
          python3 research/language-eval/compare.py --rust research/language-eval/rust/target/debug/ases-admit-rs --haskell "$RUNNER_TEMP/ases-admit-hs" | tee results/differential-dev.json
          python3 research/language-eval/compare.py --rust research/language-eval/rust/target/release/ases-admit-rs --haskell "$RUNNER_TEMP/ases-admit-hs-opt" | tee results/differential-optimized.json
      - name: Record executable sizes
        shell: bash
        run: |
          wc -c research/language-eval/rust/target/debug/ases-admit-rs research/language-eval/rust/target/release/ases-admit-rs "$RUNNER_TEMP/ases-admit-hs" "$RUNNER_TEMP/ases-admit-hs-opt" | tee results/binary-sizes.txt
      - name: Archive experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-eval-evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
