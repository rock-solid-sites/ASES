# Second generation: exclude quoted Markdown code links
name: Publish corrected frozen-evidence inventory
on:
  push:
    branches:
      - docs/frozen-design-evidence-inventory-scope-20261121
    paths:
      - .github/workflows/docs-inventory-publish-scope.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/docs_audit -p 'test_*.py' -v
      - name: Publish corrected source-pinned index to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs_audit/inventory.py --json-out docs/current-documents.json --index-out docs/CURRENT-DOCUMENTS-INDEX.md --summary
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-documents.json docs/CURRENT-DOCUMENTS-INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh current index with frozen design sources excluded"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
