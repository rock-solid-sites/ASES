name: Knowledge index prototype — real ASES documents

on:
  push:
    branches:
      - feature/knowledge-index-prototype-20261119
    paths:
      - scripts/knowledge_index/**
      - docs/research/**
      - docs/standards/**
      - .github/workflows/knowledge-index-prototype.yml

permissions:
  contents: read

jobs:
  repository-index-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/knowledge_index
            docs/research
            docs/standards
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Test fixtures and eight real ASES source documents
        env:
          PYTHONPATH: scripts/knowledge_index
        run: |
          python -m unittest discover -s scripts/knowledge_index/tests -v
      - name: Build and query real-document pilot
        run: |
          python scripts/knowledge_index/indexer.py . /tmp/ases-knowledge-index.sqlite \
            --default-visibility public \
            --include "docs/research/LLM Agents and Distributed Systems - Research Topic.md" \
            --include "docs/research/Cross-Project Knowledge Index - Minimal Schema and Integration Boundaries.md" \
            --include "docs/research/Workflow Topology Design and Reasoning Record.md" \
            --include "docs/research/EDASES Review Methodology.md" \
            --include "docs/research/Heterogeneous Synthetic Scheduler Comparison 2026-11-01.md" \
            --include "docs/standards/Documentation Standard.md" \
            --include "docs/standards/Concept - Levels of Abstraction.md" \
            --include "docs/standards/Canonical Terminology.md" \
            --search coordination --graph

      - name: Traverse full research corpus and cross-source concept/design pilot
        env:
          PYTHONPATH: scripts/knowledge_index
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from indexer import build, query, graph
          root=Path('.')
          paths=sorted(p.as_posix() for area in ('docs/research','docs/standards') for p in (root/area).rglob('*.md'))
          paths += ['docs/research/knowledge-index/pilot-2026-11-19.jsonl']
          with TemporaryDirectory() as d:
              n,e,w=build(root,Path(d)/'full.sqlite',include_paths=paths,default_visibility='public')
              links=graph(Path(d)/'full.sqlite')
              assert n >= 20, f'Unexpectedly few documents: {n}'
              assert e >= 10, f'Unexpectedly few documented relationships: {e}'
              assert ('edases:concept:central-task-assignment','related_to',
                      'github:rock-solid-sites/ASES:doc:docs/research/ASES Solver Capabilities and Rust Architecture Review 2026-11-01.md','candidate') in links
              assert ('edases:concept:information-asymmetry-boundary','related_to',
                      'github:rock-solid-sites/ASES:doc:docs/research/Workflow Topology Design and Reasoning Record.md','candidate') in links
              assert len(query(Path(d)/'full.sqlite','information')) >= 1
              print(f'CORPUS RESULT: {n} nodes, {e} candidate edges, {len(w)} warnings')
              print('Warning categories (sample):', *w[:20], sep='\n- ')
          PY
