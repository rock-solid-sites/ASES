name: Publish source-pinned ASES docs inventory snapshot
on:
  push:
    branches:
      - docs/current-source-inventory-and-legacy-closure-20261121
    paths:
      - .github/workflows/docs-inventory-publish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'rock-solid-sites/ASES' && github.ref_name == 'docs/current-source-inventory-and-legacy-closure-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the read-only scanner
        run: python -m unittest discover -s scripts/docs_audit -p 'test_*.py' -v
      - name: Generate complete owned-document status/index files
        run: |
          python scripts/docs_audit/inventory.py --json-out docs/current-documents.json --index-out docs/CURRENT-DOCUMENTS-INDEX.md --summary
      - name: Commit snapshot to research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-documents.json docs/CURRENT-DOCUMENTS-INDEX.md
          if git diff --cached --quiet; then
            echo "The generated inventory is unchanged."
          else
            git commit -m "docs: publish source-pinned ASES current-document inventory"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
