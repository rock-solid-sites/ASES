name: One-time verified documentation inventory transfer
on:
  push:
    branches: ['docs/inventory-artifact-transfer-20261127']
    paths: ['.github/workflows/inventory-artifact-transfer-20261127.yml']
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Transfer only the verified generated artifacts to the disposable branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: 'docs/inventory-artifact-transfer-20261127'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          tmp="$(mktemp -d)"
          gh run download 45932773128 --repo rock-solid-sites/ASES --name ases-current-doc-inventory --dir "$tmp"
          test "$(git hash-object "$tmp/current-documents.json")" = "156269e040dd756f72cf5ac5a4c488918ae8dab1"
          test "$(git hash-object "$tmp/CURRENT-DOCUMENTS-INDEX.md")" = "aaac98acb61f9c91894cae22296bb35279e5a243"
          cp "$tmp/current-documents.json" docs/current-documents.json
          cp "$tmp/CURRENT-DOCUMENTS-INDEX.md" docs/CURRENT-DOCUMENTS-INDEX.md
          git add -- docs/current-documents.json docs/CURRENT-DOCUMENTS-INDEX.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' docs/CURRENT-DOCUMENTS-INDEX.md docs/current-documents.json | sort)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Transfer exact verified generated inventory blobs'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
