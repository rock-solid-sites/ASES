# Read-only inventory, not a cleanup or migration job.
name: CodeGraph B2 cache sweep
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_run:
    workflows: ['CodeGraph public repository exploration']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    paths:
      - '.github/scripts/codegraph-cache-inventory.py'
      - '.github/scripts/codegraph-cache-candidates.py'
      - '.github/codegraph-cache-retention.json'
      - '.github/workflows/codegraph-cache-sweep.yml'

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/codegraph-cache-inventory.py --self-test
          python3 .github/scripts/codegraph-cache-candidates.py --self-test

  inventory:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.issue.user.login == 'rock-solid-sites' &&
        github.event.issue.title == '[codegraph-cache-sweep]') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        ((github.event.workflow_run.event == 'issues' &&
          startsWith(github.event.workflow_run.display_title, '[codegraph] ') &&
          github.event.workflow_run.actor.login == 'rock-solid-sites') ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: codegraph-b2
    concurrency:
      group: codegraph-cache-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # Never execute or consume artifacts from a triggering workflow or PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: |
          python3 .github/scripts/codegraph-cache-inventory.py --self-test
          python3 .github/scripts/codegraph-cache-candidates.py --self-test
      - name: List completed versions of the CodeGraph cache only
        id: report
        shell: bash
        env:
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_PAGER: ''
          AWS_MAX_ATTEMPTS: '3'
        run: |
          set -euo pipefail
          for name in B2_BUCKET B2_REGION B2_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing existing B2 environment setting: $name" >&2
              exit 1
            fi
          done
          raw="$(mktemp)"
          err="$(mktemp)"
          trap 'rm -f "$raw" "$err"' EXIT
          # Default AWS CLI pagination retrieves every page. Never log the raw listing.
          if ! aws s3api list-object-versions --bucket "$B2_BUCKET" --prefix codegraph/v1/ \
            --region "$B2_REGION" --endpoint-url "$B2_ENDPOINT" --output json \
            > "$raw" 2>"$err"; then
            echo 'B2 version inventory failed; existing key may lack listFiles. No storage decision made.' >&2
            exit 1
          fi
          python3 .github/scripts/codegraph-cache-inventory.py "$raw" "$RUNNER_TEMP/codegraph-cache-inventory.json"
      - name: Classify public upstream and age evidence
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/codegraph-cache-candidates.py "$RUNNER_TEMP/codegraph-cache-inventory.json"
          echo "review_required=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(str(r["review_required"] or r["candidate_count"] > 0).lower())' "$RUNNER_TEMP/codegraph-cache-inventory.json")" >> "$GITHUB_OUTPUT"
      - name: Preserve sanitized review inventory
        if: steps.candidates.outputs.review_required == 'true' || github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-cache-inventory
          path: ${{ runner.temp }}/codegraph-cache-inventory.json
          retention-days: 30
      - name: Publish retention candidates and threshold report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/codegraph-cache-inventory.json', 'utf8'));
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const fmt = n => (n / 1e9).toFixed(3) + ' GB (' + n + ' bytes)';
            const summary = [
              'CodeGraph cache prefix: codegraph/v1/',
              'Total completed object versions: ' + fmt(report.total_bytes),
              'Current: ' + fmt(report.current_bytes) + '; noncurrent: ' + fmt(report.noncurrent_bytes),
              'Recognized index keys: ' + report.recognized_indexes + '; versions: ' + report.versions + '; delete markers: ' + report.delete_markers,
              'Unrecognized layout: ' + fmt(report.unknown_layout_bytes),
              'Review required at 5 GB: ' + (report.review_required ? 'YES' : 'no'),
              'Flagged indexes: ' + report.candidate_count + '; protected: ' + report.protected_count + '; incomplete upstream checks: ' + report.incomplete_upstream_checks,
              '[Inventory run](' + runUrl + ')'
            ].join('\n\n');
            const flags = report.indexes.filter(i => i.flags.length);
            const table = rows => [
              '| Repository | Cached commit | Engine | Bytes | First/latest upload | Evidence | Recommendation |',
              '|---|---|---|---:|---|---|---|',
              ...rows.map(i => {
                const e = i.evidence;
                const details = [
                  ...i.flags,
                  e.cached_version && e.upstream_version ? e.cached_version + ' → ' + e.upstream_version + ' (' + e.version_paths.join(', ') + ')' : '',
                  e.upstream_sha ? 'upstream ' + e.upstream_sha : '',
                  e.adopted_cli ? 'adopted CLI ' + e.adopted_cli : '',
                  e.noncurrent_bytes ? 'noncurrent ' + e.noncurrent_bytes + ' bytes' : '',
                  i.upstream_status
                ].filter(Boolean).join('; ');
                return '| ' + i.repository + ' | ' + i.commit + ' | ' + i.cli + ' | ' + i.bytes + ' | ' + i.earliest_upload.slice(0,10) + ' / ' + i.latest_upload.slice(0,10) + ' | ' + details + ' | ' + i.recommendation + ' |';
              })
            ].join('\n');
            const visible = report.review_required ? report.indexes.slice(0,100) : flags.slice(0,100);
            const body = summary + '\n\n' +
              'Approve specific repository/commit/CLI keys in a comment, or retain/transfer with a stated reason. This workflow does not execute approvals or change storage. A separate exact-object recheck and explicit execution step are required. Older uploads (' + report.age_threshold_days + ' days) are weak evidence, not last use. A verified ancestor of newer upstream HEAD is a deletion candidate even without a project version; version evidence is optional. Divergent commits and old uploads are review signals, not proof of supersession. Check active research before approving; a running Actions job is not the only way a chat may need an index. Noncurrent versions are separate from the current index. Protected commits are excluded via .github/codegraph-cache-retention.json. Full sanitized inventory is in the run artifact when review is needed.\n\n' +
              (visible.length ? table(visible) : 'No current candidates.');
            await core.summary.addRaw(summary + '\n\n' + (flags.length ? table(flags.slice(0,100)) : 'No current candidates.')).write();
            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: body.slice(0,60000)});
            }
            const title = 'CodeGraph cache: retention review';
            const legacy = 'CodeGraph cache: 5 GB retention review';
            const existing = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
            const issue = existing.find(i => !i.pull_request && [title,legacy].includes(i.title));
            const begin = '<!-- codegraph-generated-report:start -->', end = '<!-- codegraph-generated-report:end -->';
            const block = begin + '\n' + body.slice(0,58000) + '\n' + end;
            if (issue) {
              const previous = issue.body || '';
              const start = previous.indexOf(begin), finish = previous.indexOf(end);
              const next = start >= 0 && finish > start ? previous.slice(0,start) + block + previous.slice(finish+end.length) : previous + '\n\n' + block;
              if (next.length <= 65000 && next !== previous) {
                await github.rest.issues.update({...context.repo, issue_number: issue.number, body: next});
              } else if (next.length > 65000) {
                core.warning('Existing review body too large; see current run summary/artifact.');
              }
            } else if (report.review_required || report.candidate_count > 0) {
              await github.rest.issues.create({...context.repo, title, body: block});
            }
