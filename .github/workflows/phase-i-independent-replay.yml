name: Phase I independent replay (experimental)
on:
  push:
    branches:
      - research/phase-i-ci-assurance-20261105
    paths:
      - '.github/workflows/phase-i-independent-replay.yml'
      - 'docs/research/phase-i-assurance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-i-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: ${{ matrix.case.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: f1-c11
            sha: 29ec3960c4c60dfb5d5f76d1c5dba7d2ea32d38a
            dir: docs/research/phase-i-f1/c11-sqlite
          - name: f4-writer-exclusion
            sha: 55aee5131141c82c9a6cd2e6418e02890a6291d8
            dir: research/phase-i-t18-sink-order-20261103/writer-exclusion
          - name: f4-published-cut
            sha: 26db6db361be986cdd168045f510f5567ee9df53
            dir: research/phase-i-t18-sink-order-20261103/published-cut
          - name: f4-receipt-loss
            sha: 9226cd4b8cd155a1d1b8e6b0495c0e1b99b941b9
            dir: research/phase-i-t18-sink-order-20261103/published-cut/receipt-loss
          - name: f3-l5-move-cuts
            sha: 51b34aface9340b7e6821b8c40dc62ca38da15e2
            dir: research/phase-i-protected-work-unit-f3/lifecycle/l5/move-cuts
          - name: f3-l6-inventory
            sha: 0f348fda050e67f3d9081a7fc22078eddc547a61
            dir: research/phase-i-protected-work-unit-f3/lifecycle/l6-inventory/race
    steps:
      - name: Checkout exact experimental source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.case.sha }}
      - name: Execute source-specific probe and checker
        shell: bash
        env:
          CASE_DIR: ${{ matrix.case.dir }}
          CASE_SHA: ${{ matrix.case.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/phase-i-evidence"
          E="$RUNNER_TEMP/phase-i-evidence"
          { echo "case_dir=$CASE_DIR"; echo "source_sha=$CASE_SHA"; echo "workflow_sha=$GITHUB_SHA"; uname -a; python3 --version; git rev-parse HEAD; } > "$E/environment.txt"
          sha256sum "$CASE_DIR/probe.py" "$CASE_DIR/check.py" > "$E/source-sha256.txt"
          timeout 180 python3 "$CASE_DIR/probe.py" > "$E/raw.json" 2> "$E/probe.stderr"
          timeout 120 python3 "$CASE_DIR/check.py" "$E/raw.json" > "$E/check.stdout" 2> "$E/check.stderr"
          cat "$E/check.stdout"
      - name: Retain independent replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i-${{ matrix.case.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase-i-evidence/
          if-no-files-found: warn
          retention-days: 30

  evidence-contract:
    name: Evidence contract positive and adversarial controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise evidence contract with deliberate invalid cases
        run: |
          cd docs/research/phase-i-assurance
          python3 -m unittest -v test_evidence_contract.py
      - name: Record test harness manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/assurance-contract"
          python3 docs/research/phase-i-assurance/evidence_contract.py docs/research/phase-i-assurance --execution PASS > "$RUNNER_TEMP/assurance-contract/manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-i-evidence-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/assurance-contract/
          retention-days: 30

  checker-mutation:
    name: Checker mutation audit - ${{ matrix.case.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: f1
            sha: 29ec3960c4c60dfb5d5f76d1c5dba7d2ea32d38a
            dir: docs/research/phase-i-f1/c11-sqlite
          - name: f4
            sha: 55aee5131141c82c9a6cd2e6418e02890a6291d8
            dir: research/phase-i-t18-sink-order-20261103/writer-exclusion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: assurance
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.case.sha }}
          path: target
      - name: Adversarial checker mutation audit
        shell: bash
        env:
          CASE_NAME: ${{ matrix.case.name }}
          CASE_DIR: ${{ matrix.case.dir }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mutation-evidence"
          python3 assurance/docs/research/phase-i-assurance/mutate_checkers.py --case "$CASE_NAME" --source "target/$CASE_DIR" > "$RUNNER_TEMP/mutation-evidence/result.json"
          cat "$RUNNER_TEMP/mutation-evidence/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-i-mutation-${{ matrix.case.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-evidence/
          retention-days: 30
