name: Final retired-provider scope check
on:
  push:
    branches: [audit/retired-provider-references-20261126]
    paths: ['.github/workflows/retired-provider-reference-audit-once.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'aa34b51f8f89cffb42ac307d5ae4ed33802c9e33'
          persist-credentials: false
      - name: Check references and current-document candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'aa34b51f8f89cffb42ac307d5ae4ed33802c9e33'
          python - <<'PY'
          import pathlib,re,json,subprocess,sys
          sys.path.insert(0,"scripts/docs_audit")
          import inventory
          data=inventory.inventory()
          pat=re.compile(r"claude|anthropic|\b(?:sonnet|haiku|opus)[ -][345]",re.I)
          names=["agent-liveness.py","guard-halt-cheapest-test.js","liveness-watchdog.sh","observer.sh","ases-kickoff-notify.service","ases-kickoff-notify.timer","kickoff-notify.py"]
          for d in data["documents"]:
              if d["declared_active"]:
                  p=pathlib.Path(d["path"])
                  hits=[i+1 for i,l in enumerate(p.read_text(errors="replace").splitlines()) if pat.search(l)]
                  if hits: print("ACTIVE="+json.dumps([d["path"],hits]))
          for p in [pathlib.Path("AGENTS.md"),pathlib.Path("docs/README.md"),*pathlib.Path("skills/current").rglob("*.md")]:
              assert not pat.search(p.read_text()), str(p)
          r=subprocess.run(["git","grep","-n","-I","-F","-o",*sum([["-e",n] for n in names],[]),"HEAD","--"],capture_output=True,text=True)
          assert r.returncode in (0,1)
          for line in r.stdout.splitlines():
              if not re.search(r"HEAD:(fork/|docs/historical/|evaluation-corpus/|\.crosslink.backup|\.design/)",line):
                  print("SCRIPT_REF="+line)
          print("COUNTS="+json.dumps(data["counts"]))
          print("CHECK_COMPLETE")
          PY
