name: One-time retired provider references audit
on:
  push:
    branches:
      - audit/retired-provider-references-20261126
    paths:
      - '.github/workflows/retired-provider-reference-audit-once.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '8df7d19343c12b9b999aca677b940c4f89418ee6'
          persist-credentials: false
      - name: Scan owned sources and distinguish historical and vendored matches
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/rock-solid-sites/ases-plugins.git "$RUNNER_TEMP/ases-plugins"
          git -C "$RUNNER_TEMP/ases-plugins" checkout -q e39324d41034a536a879b1c84bf40ce7e7021501
          git clone -q --no-checkout https://github.com/rock-solid-sites/rss-tools.git "$RUNNER_TEMP/rss-tools"
          git -C "$RUNNER_TEMP/rss-tools" checkout -q 221315ceda979c3118dc204e60681d8429ae01d2
          python - <<'PY'
          import pathlib,subprocess,re,json,os,collections
          roots=[("ASES",pathlib.Path(".")),("ases-plugins",pathlib.Path(os.environ["RUNNER_TEMP"])/"ases-plugins"),("rss-tools",pathlib.Path(os.environ["RUNNER_TEMP"])/"rss-tools")]
          pattern=re.compile(r"claude|anthropic|(?:\b(?:sonnet|haiku|opus)[ -][345](?:[. -]\d+)?\b)",re.I)
          for name,root in roots:
              paths=subprocess.check_output(["git","-C",str(root),"ls-files","-z"]).decode().split("\0")
              counts=collections.Counter()
              print("REPO",name,subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD"],text=True).strip())
              for path in filter(None,paths):
                  p=root/path
                  if not p.is_file(): continue
                  if pattern.search(path): counts["filename"]+=1
                  raw=p.read_bytes()
                  if b"\0" in raw: continue
                  lines=raw.decode("utf-8",errors="replace").splitlines()
                  matches=[(i+1,l.strip()[:230]) for i,l in enumerate(lines) if pattern.search(l)]
                  if not matches and not pattern.search(path): continue
                  archive=bool(re.search(r"(^|/)(archive|archived|historical|superseded|fork|vendor|evaluation-corpus|node_modules|\.crosslink.backup[^/]*|\.design)(/|$)",path,re.I))
                  if archive: group="archive/vendor"
                  elif re.search(r"(^|/)(skills/current|\.github/workflows|\.github/scripts|mcp|plugins|scripts|tools)(/|$)",path) or path in ("AGENTS.md","README.md","ORIENTATION.md","ARCHITECTURE.md","docs/README.md","SESSION-START.md"): group="operational-candidate"
                  else: group="other"
                  counts[group]+=1
                  counts[group+" lines"]+=len(matches)
                  if not archive:
                      print("MATCH="+json.dumps({"repo":name,"path":path,"group":group,"n":len(matches),"sample":matches[:(12 if group=="operational-candidate" else 3)]},ensure_ascii=True))
              print("COUNTS="+json.dumps({"repo":name,"counts":counts}))
          print("PROVIDER_SCAN_COMPLETE")
          PY
