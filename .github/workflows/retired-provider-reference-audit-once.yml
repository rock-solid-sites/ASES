name: Final documentation reconciliation snapshot
on:
  push:
    branches: [audit/retired-provider-references-20261126]
    paths: ['.github/workflows/retired-provider-reference-audit-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'bfeb9ba8ee4e092fd4a6086157d2c90e5517c3e7'
          persist-credentials: false
      - name: Verify current scope and generate existing inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'bfeb9ba8ee4e092fd4a6086157d2c90e5517c3e7'
          python -m unittest discover -s scripts/docs_audit -p 'test_*.py'
          python scripts/docs_audit/inventory.py --json-out "$RUNNER_TEMP/current-documents.json" --index-out "$RUNNER_TEMP/CURRENT-DOCUMENTS-INDEX.md" --summary
          python - <<'PY'
          import pathlib,re,json,subprocess,os,base64
          out=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((out/"current-documents.json").read_text())
          pat=re.compile(r"claude|anthropic|\b(?:sonnet|haiku|opus)[ -][345]",re.I)
          hits=[d["path"] for d in data["documents"] if d["declared_active"] and pat.search(pathlib.Path(d["path"]).read_text(errors="replace"))]
          print("ACTIVE_PROVIDER_MATCHES="+json.dumps(hits))
          print("BROKEN="+json.dumps([[d["path"],d["broken_relative_links"]] for d in data["documents"] if d["broken_relative_links"]]))
          assert not hits,hits
          assert not data["counts"]["broken_link_records"]
          assert not data["counts"]["duplicate_active_canonical_identities"]
          assert not pathlib.Path(".claude").exists()
          for name in ["current-documents.json","CURRENT-DOCUMENTS-INDEX.md"]:
              p=out/name
              encoded=base64.b64encode(p.read_bytes()).decode("ascii")
              print("GENERATED_BLOB="+name+":"+subprocess.check_output(["git","hash-object",str(p)],text=True).strip())
              for i in range(0,len(encoded),4096):
                  print("GENERATED_CHUNK="+name+":"+str(i//4096)+":"+encoded[i:i+4096])
              print("GENERATED_END="+name+":"+str((len(encoded)+4095)//4096))
          print("FINAL_INVENTORY_COMPLETE")
          PY
